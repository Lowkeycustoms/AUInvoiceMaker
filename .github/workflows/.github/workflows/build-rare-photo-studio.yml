      - name: Build APK
        working-directory: RarePhotoStudio
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="RarePhotoStudio/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RarePhotoStudio-v1.0-apk
          path: RarePhotoStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
