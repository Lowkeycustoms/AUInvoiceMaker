name: Build AUInvoiceMaker v1.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AUInvoiceMaker_v1.1_Preview_PNG_Source (2).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v1.1 source
        run: |
          unzip -q "AUInvoiceMaker_v1.1_Preview_PNG_Source (2).zip"
          test -f AUInvoiceMaker/app/build.gradle

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: AUInvoiceMaker
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUInvoiceMaker-v1.1-apk
          path: AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
