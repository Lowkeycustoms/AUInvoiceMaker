name: Build AUInvoiceMaker v1.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AUInvoiceMaker_v1.1_Preview_PNG_Source (2).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android API 35
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract v1.1 source
        shell: bash
        run: |
          rm -rf AUInvoiceMaker
          unzip -q -o "AUInvoiceMaker_v1.1_Preview_PNG_Source (2).zip"
          test -f AUInvoiceMaker/app/build.gradle
          test -f AUInvoiceMaker/app/src/main/java/com/rarecustoms/auinvoice/MainActivity.java

      - name: Build APK
        working-directory: AUInvoiceMaker
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUInvoiceMaker-v1.1-apk
          path: AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
