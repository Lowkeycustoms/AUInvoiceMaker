name: Build AUInvoiceMaker v1.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AUInvoiceMaker_v1.1_Preview_PNG_Source*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract v1.1 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AUInvoiceMaker_v1.1_Preview_PNG_Source*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "AUInvoiceMaker v1.1 source ZIP was not found in the repository root."
            ls -la
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"
          rm -rf AUInvoiceMaker
          unzip -q -o "$ZIP_FILE"

          test -f AUInvoiceMaker/settings.gradle
          test -f AUInvoiceMaker/build.gradle
          test -f AUInvoiceMaker/app/build.gradle
          test -f AUInvoiceMaker/app/src/main/AndroidManifest.xml
          test -f AUInvoiceMaker/app/src/main/java/com/rarecustoms/auinvoice/MainActivity.java

      - name: Build APK
        working-directory: AUInvoiceMaker
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUInvoiceMaker-v1.1-apk
          path: AUInvoiceMaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
